packages:
  - 'apps/*'
  - 'packages/*'
  - 'tests/*'

engineStrict: true
autoInstallPeers: true
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  # Usage telemetry postinstall (pulled in by swagger-ui); not needed.
  - '@scarf/scarf'
  # Optional native msgpack accelerator for BullMQ; the pure-JS fallback is used.
  - msgpackr-extract
  # Gemini SDK: its install script is a no-op echo.
  - '@google/genai'
  # Transitive (Gemini SDK): postinstall only checks for the optional protobufjs CLI.
  - protobufjs
overrides:
  # Monaco bundles an older DOMPurify with known sanitizer bypasses (pnpm audit, Phase 12).
  dompurify: '>=3.4.13 <4'
