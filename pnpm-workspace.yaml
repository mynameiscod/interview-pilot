packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true
autoInstallPeers: true
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  # Usage telemetry postinstall (pulled in by swagger-ui); not needed.
  - '@scarf/scarf'
  # Optional native msgpack accelerator for BullMQ; the pure-JS fallback is used.
  - msgpackr-extract
