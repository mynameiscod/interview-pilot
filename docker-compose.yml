# Local development stack.
#
#   pnpm infra:up                          # MongoDB + Redis only; run apps with `pnpm dev`
#   docker compose --profile apps up -d    # everything containerized (production-like images)
#
# Development only: MongoDB and Redis run without authentication and are bound
# to 127.0.0.1. Production uses docker-compose.production.yml (Phase 12).
name: cbi-dev

services:
  mongo:
    image: mongo:8.0
    # Single-node replica set: required for multi-document transactions (credit ledger, payments).
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${CBI_MONGO_HOST_PORT:-27018}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports its status.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:${CBI_REDIS_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Local inbox for development email and dev-mailbox SMS: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:${CBI_MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${CBI_MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500

  api:
    profiles: ['apps']
    build:
      context: .
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE: api
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/cbi_interview?directConnection=true
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081
      API_DOCS_ENABLED: 'true'
      PORT_API: '4000'
      PUBLIC_CANDIDATE_URL: http://localhost:8080
      PUBLIC_ADMIN_URL: http://localhost:8081
      # Development-only secrets (refused in staging/production by env validation).
      JWT_ACCESS_SECRET: dev-only-jwt-secret-change-me-0123456789abcdef
      OTP_HMAC_SECRET: dev-only-otp-secret-change-me-0123456789abcdef
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: CareerPilot Interview <no-reply@localhost>
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_REQUIRE_TLS: 'false'
      SMS_PROVIDER: dev-mailbox
      # Development-only AI settings: example master key and the labelled mock provider.
      AI_SECRETS_MASTER_KEY: ZGV2LW9ubHktYWktbWFzdGVyLWtleS1jaGFuZ2UtbWU=
      AI_MOCK_MODE: 'true'
      STORAGE_PROVIDER: local
      # Development-only mock payment gateway (Checkout is simulated in the app).
      PAYMENT_PROVIDER: mock
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - storage-data:/data/storage
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/readyz']
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    profiles: ['apps']
    build:
      context: .
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE: worker
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/cbi_interview?directConnection=true
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: '4100'
      # Report-ready emails go to the Mailpit inbox in development.
      EMAIL_PROVIDER: smtp
      EMAIL_FROM: CareerPilot Interview <no-reply@localhost>
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_REQUIRE_TLS: 'false'
      PUBLIC_CANDIDATE_URL: http://localhost:8080
      # Same development-only AI settings and storage as the API.
      AI_SECRETS_MASTER_KEY: ZGV2LW9ubHktYWktbWFzdGVyLWtleS1jaGFuZ2UtbWU=
      AI_MOCK_MODE: 'true'
      STORAGE_PROVIDER: local
      # Development-only mock payment gateway (Checkout is simulated in the app).
      PAYMENT_PROVIDER: mock
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - storage-data:/data/storage
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/readyz']
      interval: 10s
      timeout: 3s
      retries: 6

  candidate-web:
    profiles: ['apps']
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: candidate-web
        VITE_API_URL: http://localhost:4000
        VITE_APP_ENV: development
    ports:
      - '127.0.0.1:8080:8080'

  admin-web:
    profiles: ['apps']
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        APP: admin-web
        VITE_API_URL: http://localhost:4000
        VITE_APP_ENV: development
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  mongo-data:
  storage-data:
