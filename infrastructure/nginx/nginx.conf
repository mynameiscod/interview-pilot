# Edge NGINX for CareerPilot Interview (image: nginxinc/nginx-unprivileged, uid 101).
# Listens on 8080 (HTTP) and 8443 (HTTPS) inside the container; compose publishes
# them as 80/443. Everything writable lives under /tmp (tmpfs, read-only root fs).
#
# Layout inside the container:
#   /etc/nginx/nginx.conf            this file
#   /etc/nginx/snippets/*.conf       shared TLS, header, proxy and SPA snippets
#   /etc/nginx/sites/site.conf       server blocks for this environment (sites/<env>.conf)
#   /etc/nginx/cbi/                  host-managed state: upstream-api.conf (blue/green),
#                                    htpasswd and staging-allowlist.conf (staging only)
#   /srv/www/{candidate,admin}/      SPA releases (current/previous symlinks, see deploy.sh)

worker_processes auto;
worker_rlimit_nofile 65536;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  types_hash_max_size 4096;
  server_names_hash_bucket_size 128;
  # Upload routes raise this per location (snippets/api-locations.conf).
  client_max_body_size 2m;
  client_body_buffer_size 128k;
  client_header_timeout 15s;
  client_body_timeout 60s;
  send_timeout 60s;
  reset_timedout_connection on;

  # --- Request id: reuse a well-formed incoming X-Request-Id, else NGINX's own ------
  # Same shape the API accepts (apps/api/src/middleware/request-id.ts).
  map $http_x_request_id $cbi_request_id {
    default $request_id;
    '~^[A-Za-z0-9._-]{8,128}$' $http_x_request_id;
  }

  # --- Logging (JSON, one line per request, rotated by Docker json-file) -------------
  log_format cbi_json escape=json
    '{"time":"$time_iso8601","request_id":"$cbi_request_id","remote_addr":"$remote_addr",'
    '"host":"$host","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /dev/stdout cbi_json;

  # --- WebSocket upgrade (Socket.IO) --------------------------------------------------
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
  }

  # --- API origin for CSP connect-src, derived from the site host ---------------------
  # interview.codebegun.com / admin.interview.codebegun.com -> api.interview.codebegun.com
  # (and the -staging equivalents), so the header snippets are environment-agnostic.
  map $host $cbi_api_host {
    '~^(?:admin\.)?(?<cbi_base>interview(?:-staging)?\.codebegun\.com)$' api.$cbi_base;
    default api.interview.codebegun.com;
  }

  # --- Content-Security-Policy per site -------------------------------------------------
  # Candidate: Razorpay Checkout (script + frames), Google Identity Services, camera/mic
  # recordings (blob:), media playback and uploads through the API, Socket.IO over wss.
  # Admin: same app origin + API only, plus Google sign-in; no payment frames.
  # 'unsafe-inline' is limited to style attributes (React inline styles).
  map $host $cbi_csp {
    '~^admin\.' "default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://$cbi_api_host wss://$cbi_api_host https://accounts.google.com/gsi/; media-src 'self' blob: https://$cbi_api_host; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests";
    default "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://$cbi_api_host wss://$cbi_api_host https://api.razorpay.com https://lumberjack.razorpay.com https://accounts.google.com/gsi/; media-src 'self' blob: https://$cbi_api_host; frame-src https://api.razorpay.com https://checkout.razorpay.com https://accounts.google.com/gsi/; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.razorpay.com; frame-ancestors 'none'; upgrade-insecure-requests";
  }
  map $host $cbi_permissions_policy {
    '~^admin\.' 'camera=(), microphone=(), geolocation=(), payment=(), usb=()';
    default 'camera=(self), microphone=(self), geolocation=(), usb=(), payment=(self "https://checkout.razorpay.com" "https://api.razorpay.com")';
  }

  # --- X-Robots-Tag: noindex on admin, API, all staging hosts and /proof/ pages ------
  map $host $cbi_host_noindex {
    default 0;
    '~-staging\.' 1;
    '~^admin\.' 1;
    '~^api\.' 1;
  }
  map '$cbi_host_noindex:$uri' $cbi_robots_tag {
    default '';
    '~^1:' 'noindex, nofollow';
    '~^0:/proof/' 'noindex, nofollow';
  }

  # --- HSTS: 2 years on production hosts, 1 day on staging -----------------------------
  map $host $cbi_hsts {
    default 'max-age=63072000; includeSubDomains';
    '~-staging\.' 'max-age=86400';
  }

  # --- Level-1 rate limits (the API applies finer per-route limits in Redis) ---------
  # Generous per-IP limits: many candidates may share one campus/office NAT address.
  limit_req_zone $binary_remote_addr zone=cbi_api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=cbi_upload:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=cbi_conn:20m;
  limit_req_status 429;
  limit_conn_status 429;

  # --- Compression --------------------------------------------------------------------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
    application/xml application/rss+xml image/svg+xml application/manifest+json font/ttf
    application/vnd.ms-fontobject;

  # --- TLS defaults (per-server certificate paths are in snippets/tls.conf) ----------
  ssl_protocols TLSv1.2 TLSv1.3;
  # Mozilla "intermediate" (ECDHE only; TLS 1.3 suites are always enabled).
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve X25519:prime256v1:secp384r1;
  ssl_session_timeout 1d;
  ssl_session_cache shared:CBI_SSL:20m;
  ssl_session_tickets off;
  # Public resolvers for OCSP lookups (container DNS still resolves api-blue/api-green).
  resolver 1.1.1.1 9.9.9.9 valid=300s ipv6=off;
  resolver_timeout 5s;

  # --- Blue/green API upstream (rewritten by deploy.sh, then `nginx -s reload`) -------
  include /etc/nginx/cbi/upstream-api.conf;

  # --- Container health endpoint (not published) -------------------------------------
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /nginx-health {
      default_type text/plain;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }

  # --- Environment server blocks --------------------------------------------------------
  include /etc/nginx/sites/site.conf;
}
