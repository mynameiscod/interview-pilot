# Production server blocks (mounted as /etc/nginx/sites/site.conf when CBI_ENV=production).
# Hostnames: change here, in the certificate (certs.sh) and in .env.production if the
# domains differ.

# --- HTTP: ACME challenges, then redirect everything to HTTPS ---------------------------
server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    if ($host ~* ^(interview\.codebegun\.com|admin\.interview\.codebegun\.com|api\.interview\.codebegun\.com)$) {
      return 301 https://$host$request_uri;
    }
    # Unknown Host header (scanners hitting the IP): drop the connection.
    return 444;
  }
}

# --- HTTPS catch-all: refuse the TLS handshake for unknown names ----------------------
server {
  listen 8443 ssl default_server;
  listen [::]:8443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

# --- Candidate site ------------------------------------------------------------------------
server {
  include /etc/nginx/snippets/tls.conf;
  server_name interview.codebegun.com;
  set $cbi_app candidate;
  include /etc/nginx/snippets/spa-locations.conf;
}

# --- Admin site -------------------------------------------------------------------------------
server {
  include /etc/nginx/snippets/tls.conf;
  server_name admin.interview.codebegun.com;
  set $cbi_app admin;
  # Optional office/VPN allowlist for the admin console: uncomment and list networks.
  # allow 203.0.113.0/24;
  # deny all;
  include /etc/nginx/snippets/spa-locations.conf;
}

# --- API (REST + Socket.IO) ----------------------------------------------------------------
server {
  include /etc/nginx/snippets/tls.conf;
  server_name api.interview.codebegun.com;
  include /etc/nginx/snippets/api-locations.conf;
}
