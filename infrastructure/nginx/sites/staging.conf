# Staging server blocks (mounted as /etc/nginx/sites/site.conf when CBI_ENV=staging).
# Same apps as production on *-staging hostnames, with access control:
#   - candidate/admin sites: IP allowlist OR HTTP basic auth (htpasswd)
#   - API: IP allowlist only (browsers do not send basic-auth credentials on
#     cross-origin API calls), except /healthz and the Razorpay webhook
# Host-managed files (created by provision.sh / deploy.sh, edit on the server):
#   /srv/cbi/nginx/staging-allowlist.conf   lines of `<cidr> 1;`  (geo format)
#   /srv/cbi/nginx/htpasswd                 htpasswd -B entries (STAGING_BASIC_AUTH)
# Every staging response carries X-Robots-Tag: noindex (nginx.conf).

geo $cbi_staging_ip_allowed {
  default 0;
  127.0.0.1/32 1;
  include /etc/nginx/cbi/staging-allowlist.conf;
}

# Sites: allowlisted IPs skip basic auth; everyone else must authenticate.
map $cbi_staging_ip_allowed $cbi_staging_auth {
  1 off;
  default 'CareerPilot staging';
}

# API: allowlisted IPs only, except the health probe and payment webhooks.
map '$cbi_staging_ip_allowed:$uri' $cbi_staging_api_denied {
  default 1;
  '~^1:' 0;
  '0:/healthz' 0;
  '0:/api/v1/payments/webhooks/razorpay' 0;
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    if ($host ~* ^(interview-staging\.codebegun\.com|admin\.interview-staging\.codebegun\.com|api\.interview-staging\.codebegun\.com)$) {
      return 301 https://$host$request_uri;
    }
    return 444;
  }
}

server {
  listen 8443 ssl default_server;
  listen [::]:8443 ssl default_server;
  server_name _;
  ssl_reject_handshake on;
}

server {
  include /etc/nginx/snippets/tls.conf;
  server_name interview-staging.codebegun.com;
  set $cbi_app candidate;
  auth_basic $cbi_staging_auth;
  auth_basic_user_file /etc/nginx/cbi/htpasswd;
  include /etc/nginx/snippets/spa-locations.conf;
}

server {
  include /etc/nginx/snippets/tls.conf;
  server_name admin.interview-staging.codebegun.com;
  set $cbi_app admin;
  auth_basic $cbi_staging_auth;
  auth_basic_user_file /etc/nginx/cbi/htpasswd;
  include /etc/nginx/snippets/spa-locations.conf;
}

server {
  include /etc/nginx/snippets/tls.conf;
  server_name api.interview-staging.codebegun.com;
  if ($cbi_staging_api_denied) {
    return 403;
  }
  include /etc/nginx/snippets/api-locations.conf;
}
