# TLS for one environment: a single Let's Encrypt SAN certificate named `cbi`
# covers the candidate, admin and API hostnames (infrastructure/scripts/certs.sh).
listen 8443 ssl;
listen [::]:8443 ssl;
http2 on;

ssl_certificate /etc/letsencrypt/live/cbi/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/cbi/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/cbi/chain.pem;

# OCSP stapling. Let's Encrypt stopped publishing OCSP URLs in 2025, so NGINX logs
# "ssl_stapling ignored" for LE certificates; kept for certificates from other CAs.
ssl_stapling on;
ssl_stapling_verify on;
