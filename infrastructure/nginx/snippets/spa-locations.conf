# Static SPA serving. Requires `set $cbi_app candidate|admin;` in the server block.
#
# deploy.sh extracts each release from the web image into
#   /srv/www/<app>/releases/<tag>/   and points   current -> releases/<tag>
#                                                 previous -> releases/<previous tag>
# Hashed assets fall back to the previous release so browsers still running the
# old index.html can lazy-load their chunks right after a deploy.
root /srv/www/$cbi_app/current;
index index.html;
disable_symlinks off;
etag on;

# Hashed build output: immutable for a year.
location /assets/ {
  include /etc/nginx/snippets/headers-site.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri @previous_assets;
}

location @previous_assets {
  root /srv/www/$cbi_app/previous;
  include /etc/nginx/snippets/headers-site.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# Brand files must 404 when missing (the app then shows its placeholder).
location /brand/ {
  include /etc/nginx/snippets/headers-site.conf;
  add_header Cache-Control "public, max-age=3600" always;
  try_files $uri =404;
}

# index.html is never cached, so a deploy is picked up on the next navigation.
location = /index.html {
  include /etc/nginx/snippets/headers-site.conf;
  add_header Cache-Control "no-cache, must-revalidate" always;
}

location / {
  include /etc/nginx/snippets/headers-site.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri /index.html;
}

# Never serve dotfiles or source maps publicly.
location ~ /\. {
  return 404;
}
location ~ \.map$ {
  return 404;
}
