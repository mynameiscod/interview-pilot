# API host locations. Body limits mirror the app's own limits (the app enforces the
# exact values; NGINX only stops oversized bodies early):
#   JSON 1 MB (REQUEST_BODY_LIMIT) -> 2 MB here
#   resume/JD upload 8 MB (UPLOAD_MAX_MB), media segment 8 MB, voice clip 10 MB
#   (+ multipart overhead) -> 12 MB on the upload routes below.

limit_conn cbi_conn 200;

# Default upstream timeouts (Socket.IO and uploads override them below).
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Liveness only; readiness is internal (deploy.sh checks it on the Docker network).
location = /healthz {
  include /etc/nginx/snippets/headers-api.conf;
  include /etc/nginx/snippets/proxy-api.conf;
  access_log off;
}
location = /readyz {
  return 404;
}

# Socket.IO (namespace /rt). WebSocket first, long-polling fallback (sticky via ip_hash).
location /socket.io/ {
  include /etc/nginx/snippets/headers-api.conf;
  include /etc/nginx/snippets/proxy-api.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_buffering off;
  # Socket.IO pings every 25 s; a silent socket for 2 min is dead.
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

# Razorpay webhooks: raw body signature check in the app. Kept outside the staging
# IP gate (see sites/staging.conf) and the general rate limit.
location = /api/v1/payments/webhooks/razorpay {
  include /etc/nginx/snippets/headers-api.conf;
  include /etc/nginx/snippets/proxy-api.conf;
  proxy_set_header Connection "";
  client_max_body_size 1m;
}

# Uploads: resumes, interview video segments, voice clips.
location ~ ^/api/v1/(resumes|interviews/[^/]+/media/segments/[0-9]+|interviews/[^/]+/voice/transcribe)$ {
  include /etc/nginx/snippets/headers-api.conf;
  include /etc/nginx/snippets/proxy-api.conf;
  proxy_set_header Connection "";
  limit_req zone=cbi_upload burst=20 nodelay;
  client_max_body_size 12m;
  client_body_timeout 120s;
  proxy_send_timeout 120s;
  proxy_read_timeout 120s;
}

# Everything else under the API host.
location / {
  include /etc/nginx/snippets/headers-api.conf;
  include /etc/nginx/snippets/proxy-api.conf;
  proxy_set_header Connection "";
  limit_req zone=cbi_api burst=60 nodelay;
}
