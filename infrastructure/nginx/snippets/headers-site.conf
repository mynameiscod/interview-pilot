# Security headers for the candidate and admin SPAs. Included in EVERY location that
# serves them: an add_header inside a location discards all inherited ones.
# CSP / Permissions-Policy / X-Robots-Tag values are chosen per host in nginx.conf.
add_header Strict-Transport-Security $cbi_hsts always;
add_header Content-Security-Policy $cbi_csp always;
add_header Permissions-Policy $cbi_permissions_policy always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Empty value = header omitted (production candidate pages other than /proof/).
add_header X-Robots-Tag $cbi_robots_tag always;
add_header X-Request-Id $cbi_request_id always;
