# Common proxy settings for the API upstream (blue/green: see upstream-api.conf).
proxy_pass http://cbi_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (not append): TRUST_PROXY_HOPS=1 trusts exactly this one hop.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $cbi_request_id;
# Retry another server only for failures before the request reached the app.
proxy_next_upstream error timeout http_502;
proxy_next_upstream_tries 2;
# The API sets its own HSTS via helmet; NGINX's value wins.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
