# Extra CSP connect-src origins for both SPAs. Template only: the live copy is
# /srv/cbi/nginx/csp-connect.conf, rewritten by infrastructure/scripts/deploy.sh on
# every deploy from CSP_CONNECT_SRC_EXTRA in /srv/cbi/.env.<env> (space-separated
# https origins), or, when that is unset, from the origin of SENTRY_DSN. The browser
# error tracker posts events to the DSN host (docs/deployment/observability.md).
#
# Empty value = no extra origins.
map $host $cbi_csp_connect_extra {
  default "";
}
