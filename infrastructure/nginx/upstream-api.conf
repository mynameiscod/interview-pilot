# Blue/green API upstream. Template only: the live copy is
# /srv/cbi/nginx/upstream-api.conf, rewritten by infrastructure/scripts/deploy.sh
# (then `nginx -t && nginx -s reload`). Exactly one colour receives traffic.
#
# ip_hash keeps Socket.IO long-polling clients on one process if a colour is ever
# scaled to more than one container.
upstream cbi_api {
  ip_hash;
  server api-blue:4000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}
