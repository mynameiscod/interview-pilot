# Redis for CareerPilot Interview (staging/production).
# Holds BullMQ queues, the Socket.IO adapter, locks, rate-limit counters and caches.
# The password is passed on the command line from .env.datastores (--requirepass).

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 4096
timeout 0
tcp-keepalive 60
maxclients 20000

# --- Persistence: BullMQ jobs must survive a restart --------------------------
dir /data
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-use-rdb-preamble yes
# Periodic RDB snapshots as a second safety net.
save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes

# --- Memory: never evict (BullMQ requirement) --------------------------------
# Writes fail loudly instead of silently dropping queue keys. Keep below the
# container memory limit (3 GB) to leave room for fork/AOF rewrite.
maxmemory 2gb
maxmemory-policy noeviction

# --- Safety ------------------------------------------------------------------
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
loglevel notice
logfile ""
